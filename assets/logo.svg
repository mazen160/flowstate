<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" role="img" aria-label="flowstate">
  <title>flowstate</title>
  <desc>A stylized audio waveform morphing into a terminal caret, followed by the flowstate wordmark.</desc>

  <defs>
    <linearGradient id="fsAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <style>
      .word { font-family: 'JetBrains Mono','SF Mono','Menlo','DejaVu Sans Mono',ui-monospace,monospace;
              font-weight: 700; font-size: 96px; letter-spacing: -2px; }
      .word-light { fill: #0f172a; }
      .word-dark  { fill: #f8fafc; }
      .bar { stroke: url(#fsAccent); stroke-width: 10; stroke-linecap: round; fill: none; }
      .caret { fill: url(#fsAccent); }
      @media (prefers-color-scheme: dark) {
        .word-auto { fill: #f8fafc; }
      }
      @media (prefers-color-scheme: light) {
        .word-auto { fill: #0f172a; }
      }
    </style>
  </defs>

  <!-- Mark: waveform morphing into a caret -->
  <g transform="translate(20,40)">
    <line class="bar" x1="6"  y1="50" x2="6"  y2="70"/>
    <line class="bar" x1="28" y1="36" x2="28" y2="84"/>
    <line class="bar" x1="50" y1="22" x2="50" y2="98"/>
    <line class="bar" x1="72" y1="6"  x2="72" y2="114"/>
    <line class="bar" x1="94" y1="20" x2="94" y2="100"/>
    <line class="bar" x1="116" y1="34" x2="116" y2="86"/>
    <!-- caret/cursor block -->
    <rect class="caret" x="138" y="44" width="14" height="32" rx="2">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Wordmark -->
  <text class="word word-auto" x="190" y="108">flowstate</text>
</svg>
