<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>flowstate</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  /* Critical layout shipped inline so the page paints before app.js loads. */
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #07080b; }
  body {
    min-height: 100vh;
    color: #e6e8eb;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <span class="brand-name">flowstate</span>
    </div>
    <div class="session-bar">
      <span id="session-label" class="session-label">Session</span>
      <button id="new-session" class="btn btn-ghost" type="button">
        <span class="icon-plus" aria-hidden="true">+</span> New session
      </button>
    </div>
  </div>
</header>

<main class="page">
  <section class="recorder" aria-labelledby="rec-heading">
    <h1 id="rec-heading" class="visually-hidden">Record</h1>
    <button id="rec" class="rec-btn" type="button" aria-pressed="false" aria-label="Record">
      <span class="rec-ring" aria-hidden="true"></span>
      <span class="rec-dot" aria-hidden="true"></span>
    </button>
    <p id="rec-hint" class="rec-hint">
      Hold <kbd>Enter</kbd>, <kbd>End</kbd>, or <kbd>Space</kbd> to record
    </p>
    <p id="rec-status" class="rec-status" role="status" aria-live="polite"></p>
  </section>

  <section id="result" class="result-card" hidden>
    <div class="result-header">
      <span class="section-label">Latest</span>
      <button class="raw-toggle" id="result-raw-toggle" type="button" aria-expanded="false">
        Show raw
      </button>
    </div>
    <p id="result-cleaned" class="result-text"></p>
    <p id="result-raw" class="result-raw" hidden></p>
  </section>

  <section class="history-section">
    <div class="history-header">
      <span class="section-label">History</span>
      <span id="history-count" class="history-count"></span>
    </div>
    <ol id="history-list" class="history-list"></ol>
    <p id="history-empty" class="history-empty">No transcripts in this session yet.</p>
  </section>
</main>

<footer class="dock">
  <div class="dock-inner">
    <button id="export-json" class="btn btn-ghost" type="button">Export JSON</button>
    <button id="export-md" class="btn btn-ghost" type="button">Export Markdown</button>
    <button id="toggle-settings" class="btn btn-ghost" type="button" aria-expanded="false">
      <span class="icon-gear" aria-hidden="true">⚙</span> Settings
    </button>
  </div>
  <div id="settings" class="settings-sheet" hidden>
    <div class="settings-grid">
      <label class="field">
        <span class="field-label">API token</span>
        <input id="token-input" type="password" autocomplete="off" spellcheck="false"
               placeholder="Bearer token (only if the server requires one)">
      </label>
      <label class="field">
        <span class="field-label">Switch session</span>
        <select id="session-select"></select>
      </label>
    </div>
    <p id="version-line" class="version-line"></p>
  </div>
</footer>

<script src="/static/app.js" defer></script>
</body>
</html>
