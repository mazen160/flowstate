<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>flowstate</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  /* Critical layout shipped inline so the page paints before app.js loads. */
  body { margin: 0; min-height: 100vh; background: #0e1014; color: #e6e8eb;
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 20px 80px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 28px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="brand">flowstate</h1>
    <div class="session-bar">
      <span id="session-label" class="muted">Session</span>
      <button id="new-session" class="ghost" type="button">New session</button>
    </div>
  </header>

  <main>
    <section class="recorder">
      <button id="rec" type="button" aria-pressed="false" aria-label="Record">
        <span class="rec-dot" aria-hidden="true"></span>
      </button>
      <p id="rec-hint" class="muted hint">Hold <kbd>Enter</kbd>, <kbd>End</kbd>, or <kbd>Space</kbd> to record</p>
      <p id="rec-status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section id="result" class="card result" hidden>
      <h2 class="card-title">Latest</h2>
      <p id="result-cleaned" class="result-text"></p>
      <details class="raw">
        <summary>Show raw</summary>
        <p id="result-raw" class="muted result-raw"></p>
      </details>
    </section>

    <section class="history">
      <h2 class="card-title">History</h2>
      <ol id="history-list" class="history-list"></ol>
      <p id="history-empty" class="muted empty">No transcripts in this session yet.</p>
    </section>
  </main>

  <footer>
    <div class="footer-row">
      <button id="export-json" class="ghost" type="button">Export JSON</button>
      <button id="export-md" class="ghost" type="button">Export Markdown</button>
      <button id="toggle-settings" class="ghost" type="button" aria-expanded="false">Settings</button>
    </div>
    <div id="settings" class="settings" hidden>
      <label class="field">
        <span class="muted">API token</span>
        <input id="token-input" type="password" autocomplete="off" spellcheck="false"
               placeholder="Bearer token (only needed if the server requires one)">
      </label>
      <label class="field">
        <span class="muted">Switch session</span>
        <select id="session-select"></select>
      </label>
      <p id="version-line" class="muted tiny"></p>
    </div>
  </footer>
</div>
<script src="/static/app.js" defer></script>
</body>
</html>
