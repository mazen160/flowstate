name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.24"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxtst-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxcb1-dev \
            libx11-xcb-dev \
            libxt-dev \
            pulseaudio-utils \
            alsa-utils \
            xvfb

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      # gohook's libuiohook calls XOpenDisplay() at C-library load time.
      # On Linux that's lazy: the test binary doesn't crash until the
      # gohook init runs, which is on first import of internal/trigger.
      # The headless GitHub runner has no $DISPLAY, so we wrap the test
      # process in xvfb-run to give it a throwaway virtual X server.
      # macOS and Windows runners have working display layers and don't
      # need the wrapper.
      - name: Test (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a go test ./... -timeout 120s -race

      - name: Test (macOS / Windows)
        if: runner.os != 'Linux'
        run: go test ./... -timeout 120s -race
